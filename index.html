<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PDF Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f4f0;
  --toolbar:#1a1a1e;
  --toolbar2:#26262c;
  --border:#333340;
  --accent:#f0a500;
  --accent2:#ffc84a;
  --text:#e8e8e0;
  --muted:#888890;
  --green:#4ade80;
  --red:#f87171;
  --white:#ffffff;
  --shadow:rgba(0,0,0,0.35);
}

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'IBM Plex Sans',sans-serif}
body{display:flex;flex-direction:column}

/* ── Toolbar ── */
.toolbar{
  height:52px;background:var(--toolbar);
  display:flex;align-items:center;gap:0;
  flex-shrink:0;z-index:200;
  box-shadow:0 2px 16px var(--shadow);
}
.tb-brand{
  padding:0 20px;font-size:14px;font-weight:600;
  color:var(--accent);letter-spacing:-.3px;
  border-right:1px solid var(--border);height:100%;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.tb-brand svg{flex-shrink:0}
.tb-group{
  display:flex;align-items:center;gap:4px;
  padding:0 12px;border-right:1px solid var(--border);height:100%;
}
.tb-group:last-child{border-right:none;margin-left:auto}

/* toolbar controls */
.tb-btn{
  background:none;border:1px solid transparent;color:var(--muted);
  border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif;font-weight:500;
  display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;
}
.tb-btn:hover{background:var(--toolbar2);color:var(--text);border-color:var(--border)}
.tb-btn.active{background:var(--toolbar2);color:var(--accent);border-color:var(--accent)}
.tb-btn.primary{background:var(--accent);color:#1a1a1e;border-color:var(--accent);font-weight:600}
.tb-btn.primary:hover{background:var(--accent2)}
.tb-btn:disabled{opacity:.35;cursor:not-allowed}

.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}

.tb-input{
  background:var(--toolbar2);border:1px solid var(--border);
  color:var(--text);border-radius:6px;padding:4px 8px;
  font-size:12px;font-family:'IBM Plex Mono',monospace;
  outline:none;transition:border .15s;
}
.tb-input:focus{border-color:var(--accent)}

.tb-label{font-size:11px;color:var(--muted);white-space:nowrap}

input[type=color].tb-color{
  width:28px;height:28px;border-radius:5px;border:1px solid var(--border);
  background:none;cursor:pointer;padding:1px;
}

.page-info{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap}

/* ── Upload screen ── */
.upload-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.upload-card{
  background:white;border-radius:16px;padding:48px 56px;text-align:center;
  box-shadow:0 8px 48px rgba(0,0,0,.12);max-width:420px;width:100%;
}
.upload-card h2{font-size:22px;font-weight:600;color:#1a1a1e;margin-bottom:8px}
.upload-card p{font-size:14px;color:#888;margin-bottom:28px}
.drop-zone{
  border:2px dashed #d0d0d0;border-radius:12px;padding:36px 24px;
  cursor:pointer;transition:all .2s;background:#fafafa;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:#fff8e8}
.drop-zone svg{margin-bottom:12px;color:#bbb}
.drop-zone p{font-size:13px;color:#999}
.drop-zone strong{color:var(--accent)}
.drop-zone input{display:none}

/* ── Editor ── */
.editor{flex:1;overflow:auto;display:none;
  background:var(--bg);
  background-image:
    linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px);
  background-size:20px 20px;
  padding:32px;align-items:flex-start;justify-content:center;
}
.editor.visible{display:flex}

.pdf-stage{
  position:relative;
  box-shadow:0 8px 48px var(--shadow), 0 2px 8px rgba(0,0,0,.2);
  border-radius:2px;background:white;
  /* cursor is set dynamically */
}
#pdfCanvas{display:block}

/* overlay container sits on top of canvas, captures all interaction */
#overlayEl{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none; /* children handle individually */
}

/* ── Text boxes ── */
.tbox{
  position:absolute;
  min-width:4px;min-height:1em;
  outline:none;
  white-space:pre;
  cursor:text;
  line-height:1.25;
  /* border shown on hover/focus */
  border:1.5px solid transparent;
  border-radius:2px;
  padding:1px 3px;
  transition:border-color .1s;
  pointer-events:auto;
  /* prevent browser spell-check decoration */
  -webkit-user-modify:read-write-plaintext-only;
}
.tbox:hover{border-color:rgba(240,165,0,.5)}
.tbox:focus{border-color:var(--accent);outline:none}
.tbox.selected{border-color:var(--accent)}

/* blinking cursor when empty */
.tbox:empty::before{
  content:'|';
  animation:blink .9s step-end infinite;
  color:var(--accent);
  font-weight:300;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* resize handle */
.tbox-handle{
  position:absolute;
  width:8px;height:8px;
  background:var(--accent);border-radius:2px;
  bottom:-4px;right:-4px;cursor:se-resize;
  pointer-events:auto;display:none;
}
.tbox-wrap{position:absolute;pointer-events:none}
.tbox-wrap.active .tbox-handle{display:block}
.tbox-wrap.active .tbox{border-color:var(--accent)}

/* delete handle */
.tbox-del{
  position:absolute;top:-10px;right:-10px;
  width:18px;height:18px;border-radius:50%;
  background:var(--red);color:white;border:none;
  font-size:11px;cursor:pointer;display:none;
  align-items:center;justify-content:center;line-height:1;
  pointer-events:auto;z-index:10;
}
.tbox-wrap.active .tbox-del{display:flex}

/* drag bar */
.tbox-drag{
  position:absolute;top:-18px;left:0;right:0;height:16px;
  background:var(--accent);border-radius:3px 3px 0 0;
  cursor:grab;display:none;align-items:center;justify-content:center;
  pointer-events:auto;
}
.tbox-drag:active{cursor:grabbing}
.tbox-drag-dots{
  display:flex;gap:3px;
}
.tbox-drag-dots span{
  width:3px;height:3px;border-radius:50%;background:rgba(0,0,0,.4);
}
.tbox-wrap.active .tbox-drag{display:flex}

/* ── Toast ── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--toolbar);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:9px 16px;font-size:13px;
  opacity:0;transition:all .22s;pointer-events:none;z-index:999;
  white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* ── Spinner ── */
.spinner{
  display:inline-block;width:12px;height:12px;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="tb-brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>
    </svg>
    PDF Editor
  </div>

  <!-- Font size -->
  <div class="tb-group">
    <span class="tb-label">Size</span>
    <input class="tb-input" type="number" id="fontSize" value="14" min="4" max="200" style="width:54px" title="Font size (pt)"/>
    <span class="tb-label">pt</span>
  </div>

  <!-- Color -->
  <div class="tb-group">
    <span class="tb-label">Color</span>
    <input type="color" class="tb-color" id="colorPicker" value="#000000" title="Text color"/>
    <input class="tb-input" type="text" id="colorHex" value="#000000" style="width:76px;font-family:'IBM Plex Mono',monospace" maxlength="7"/>
  </div>

  <!-- Font -->
  <div class="tb-group">
    <span class="tb-label">Font</span>
    <select class="tb-input" id="fontSelect" style="padding:4px 6px">
      <option value="auto">Auto (match PDF)</option>
      <option value="Helvetica">Helvetica</option>
      <option value="Times-Roman">Times Roman</option>
      <option value="Courier">Courier</option>
    </select>
  </div>

  <!-- Page nav -->
  <div class="tb-group" id="pageNav" style="display:none">
    <button class="tb-btn" onclick="changePage(-1)" title="Previous page">‹</button>
    <span class="page-info" id="pageInfo">1 / 1</span>
    <button class="tb-btn" onclick="changePage(1)" title="Next page">›</button>
  </div>

  <!-- Detected font -->
  <div class="tb-group" id="fontBadgeGroup" style="display:none">
    <span class="tb-label">PDF font:</span>
    <span style="font-size:12px;color:var(--accent);font-family:'IBM Plex Mono',monospace" id="fontBadge">—</span>
  </div>

  <!-- Actions -->
  <div class="tb-group">
    <button class="tb-btn" onclick="document.getElementById('fileInput2').click()" title="Open another PDF">
      📂 Open
    </button>
    <input type="file" id="fileInput2" accept=".pdf" style="display:none" onchange="loadPDF(this.files[0])"/>
    <div class="tb-sep"></div>
    <button class="tb-btn primary" id="downloadBtn" disabled onclick="downloadPDF()">⬇ Download</button>
  </div>
</div>

<!-- Upload screen -->
<div class="upload-screen" id="uploadScreen">
  <div class="upload-card">
    <h2>PDF Text Editor</h2>
    <p>Click anywhere on your PDF to place a text box and start typing.</p>
    <div class="drop-zone" id="dropZone"
         onclick="document.getElementById('fileInput').click()"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      <p><strong>Click to upload</strong> or drag & drop</p>
      <p style="margin-top:6px;font-size:12px">PDF files only</p>
      <input type="file" id="fileInput" accept=".pdf" onchange="loadPDF(this.files[0])"/>
    </div>
  </div>
</div>

<!-- Editor canvas area -->
<div class="editor" id="editor">
  <div class="pdf-stage" id="pdfStage" onclick="onStageClick(event)">
    <canvas id="pdfCanvas"></canvas>
    <div id="overlayEl"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── State ──────────────────────────────────────────────────────────────────
let pdfBytes = null;
let pdfjsDoc = null;
let pdfLibDoc = null;
let currentPage = 1;
let totalPages = 1;
let scale = 1.5;
let detectedFontName = 'Helvetica';
let boxes = [];          // { el, wrapEl, page, contenteditable div }
let activeBox = null;

// ── Drag/drop upload ───────────────────────────────────────────────────────
function onDragOver(e){ e.preventDefault(); document.getElementById('dropZone').classList.add('drag'); }
function onDragLeave(){ document.getElementById('dropZone').classList.remove('drag'); }
function onDrop(e){
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if(f && f.type==='application/pdf') loadPDF(f);
  else toast('Drop a PDF file','err');
}

// ── Load PDF ───────────────────────────────────────────────────────────────
async function loadPDF(file){
  if(!file) return;
  toast('Loading…');
  try{
    pdfBytes = await file.arrayBuffer();

    // pdf-lib for writing
    pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
    totalPages = pdfLibDoc.getPageCount();
    detectedFontName = detectFont(pdfLibDoc);
    document.getElementById('fontBadge').textContent = detectedFontName;
    document.getElementById('fontBadgeGroup').style.display = '';
    document.getElementById('pageNav').style.display = totalPages > 1 ? '' : 'none';

    // PDF.js for rendering
    pdfjsDoc = await pdfjsLib.getDocument({data: pdfBytes.slice(0)}).promise;
    currentPage = 1;
    boxes = [];
    activeBox = null;

    // Show editor
    document.getElementById('uploadScreen').style.display = 'none';
    document.getElementById('editor').classList.add('visible');
    document.getElementById('downloadBtn').disabled = false;

    await renderPage(currentPage);
    toast('Click anywhere on the PDF to add text','ok');
  } catch(err){
    console.error(err);
    toast('Load failed: '+err.message,'err');
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
async function renderPage(num){
  const page = await pdfjsDoc.getPage(num);
  const vp = page.getViewport({scale});
  const canvas = document.getElementById('pdfCanvas');
  canvas.width = vp.width; canvas.height = vp.height;

  const stage = document.getElementById('pdfStage');
  stage.style.width = vp.width+'px';
  stage.style.height = vp.height+'px';

  const overlay = document.getElementById('overlayEl');
  overlay.style.width = vp.width+'px';
  overlay.style.height = vp.height+'px';

  await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
  document.getElementById('pageInfo').textContent = `${num} / ${totalPages}`;

  // re-render boxes for this page
  overlay.innerHTML = '';
  boxes.filter(b=>b.page===currentPage).forEach(b=>overlay.appendChild(b.wrapEl));
}

async function changePage(delta){
  const next = currentPage + delta;
  if(next<1||next>totalPages) return;
  // save active box content
  blurActive();
  currentPage = next;
  await renderPage(currentPage);
}

// ── Click on stage → create text box ──────────────────────────────────────
function onStageClick(e){
  // If clicking on an existing box or its wrap, don't create a new one
  if(e.target !== document.getElementById('pdfStage') &&
     e.target !== document.getElementById('pdfCanvas') &&
     e.target !== document.getElementById('overlayEl')) return;

  blurActive();

  const stage = document.getElementById('pdfStage');
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  createBox(x, y, currentPage, true);
}

function createBox(x, y, page, focusNow=false, initialText=''){
  const size = parseFloat(document.getElementById('fontSize').value)||14;
  const color = document.getElementById('colorHex').value||'#000000';
  const fontSel = document.getElementById('fontSelect').value;

  // wrapper (absolutely positioned in overlay)
  const wrap = document.createElement('div');
  wrap.className = 'tbox-wrap';
  wrap.style.position = 'absolute';
  wrap.style.left = x+'px';
  wrap.style.top = y+'px';
  wrap.style.pointerEvents = 'none';

  // drag bar
  const dragBar = document.createElement('div');
  dragBar.className = 'tbox-drag';
  const dots = document.createElement('div');
  dots.className = 'tbox-drag-dots';
  for(let i=0;i<6;i++) dots.appendChild(Object.assign(document.createElement('span'),{}));
  dragBar.appendChild(dots);
  wrap.appendChild(dragBar);

  // delete button
  const del = document.createElement('button');
  del.className = 'tbox-del';
  del.textContent = '×';
  del.title = 'Delete';
  del.onclick = (ev)=>{ ev.stopPropagation(); removeBox(box); };
  wrap.appendChild(del);

  // contenteditable div
  const div = document.createElement('div');
  div.className = 'tbox';
  div.contentEditable = 'plaintext-only';
  div.spellcheck = false;
  div.style.fontSize = (size * scale * 72/96)+'px';
  div.style.color = color;
  div.style.fontFamily = cssFontFor(fontSel==='auto'?detectedFontName:fontSel);
  div.style.minWidth = '40px';
  if(initialText) div.textContent = initialText;
  wrap.appendChild(div);

  // resize handle
  const handle = document.createElement('div');
  handle.className = 'tbox-handle';
  wrap.appendChild(handle);

  const box = { wrapEl: wrap, textEl: div, page, x, y, size, color, font: fontSel };
  boxes.push(box);

  if(page === currentPage){
    document.getElementById('overlayEl').appendChild(wrap);
  }

  // ── events ──
  div.addEventListener('focus', ()=>{ setActive(box); });
  div.addEventListener('blur', ()=>{ if(activeBox===box && !div.textContent.trim()) removeBox(box); });
  div.addEventListener('keydown', e=>{ if(e.key==='Escape'){ div.blur(); } });

  // Drag bar move
  makeDraggable(dragBar, box);

  // Resize handle
  makeResizable(handle, box);

  if(focusNow){
    setActive(box);
    setTimeout(()=>div.focus(), 0);
  }

  return box;
}

function setActive(box){
  if(activeBox && activeBox!==box) activeBox.wrapEl.classList.remove('active');
  activeBox = box;
  box.wrapEl.classList.add('active');
  // sync toolbar
  document.getElementById('fontSize').value = box.size;
  document.getElementById('colorHex').value = box.color;
  document.getElementById('colorPicker').value = box.color;
}

function blurActive(){
  if(activeBox){
    activeBox.wrapEl.classList.remove('active');
    activeBox.textEl.blur();
    activeBox = null;
  }
}

function removeBox(box){
  box.wrapEl.remove();
  boxes = boxes.filter(b=>b!==box);
  if(activeBox===box) activeBox=null;
}

// ── Draggable ──────────────────────────────────────────────────────────────
function makeDraggable(handle, box){
  handle.addEventListener('mousedown', e=>{
    e.preventDefault(); e.stopPropagation();
    const stage = document.getElementById('pdfStage');
    const sr = stage.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const ox = box.x, oy = box.y;

    function move(ev){
      box.x = Math.max(0, ox + ev.clientX - startX);
      box.y = Math.max(0, oy + ev.clientY - startY);
      box.wrapEl.style.left = box.x+'px';
      box.wrapEl.style.top  = box.y+'px';
    }
    function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// ── Resizable ──────────────────────────────────────────────────────────────
function makeResizable(handle, box){
  handle.addEventListener('mousedown', e=>{
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startW = box.textEl.offsetWidth, startH = box.textEl.offsetHeight;

    function move(ev){
      const w = Math.max(40, startW + ev.clientX - startX);
      const h = Math.max(20, startH + ev.clientY - startY);
      box.textEl.style.width = w+'px';
      box.textEl.style.height = h+'px';
      box.textEl.style.whiteSpace = 'pre-wrap';
      box.textEl.style.overflow = 'hidden';
    }
    function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

// ── Toolbar live updates ───────────────────────────────────────────────────
document.getElementById('fontSize').addEventListener('input', function(){
  if(!activeBox) return;
  activeBox.size = parseFloat(this.value)||14;
  activeBox.textEl.style.fontSize = (activeBox.size * scale * 72/96)+'px';
});

document.getElementById('colorPicker').addEventListener('input', function(){
  document.getElementById('colorHex').value = this.value;
  applyColor(this.value);
});
document.getElementById('colorHex').addEventListener('input', function(){
  if(/^#[0-9a-fA-F]{6}$/.test(this.value)){
    document.getElementById('colorPicker').value = this.value;
    applyColor(this.value);
  }
});
function applyColor(c){
  if(!activeBox) return;
  activeBox.color = c;
  activeBox.textEl.style.color = c;
}

document.getElementById('fontSelect').addEventListener('change', function(){
  if(!activeBox) return;
  activeBox.font = this.value;
  const name = this.value==='auto'?detectedFontName:this.value;
  activeBox.textEl.style.fontFamily = cssFontFor(name);
});

// ── Font helpers ───────────────────────────────────────────────────────────
function cssFontFor(name){
  const n=(name||'').toLowerCase();
  if(n.includes('times')||n.includes('palatino')||n.includes('garamond')) return 'Georgia,"Times New Roman",serif';
  if(n.includes('courier')||n.includes('mono')||n.includes('consolas')) return '"Courier New",Courier,monospace';
  return '"Helvetica Neue",Helvetica,Arial,sans-serif';
}

function detectFont(doc){
  try{
    const page = doc.getPage(0);
    const dict = page.node.get(PDFLib.PDFName.of('Resources'));
    if(!dict) return 'Helvetica';
    const fonts = dict.get(PDFLib.PDFName.of('Font'));
    if(!fonts) return 'Helvetica';
    for(const k of fonts.keys()){
      const fd = fonts.get(k);
      if(!fd) continue;
      const bf = fd.get && fd.get(PDFLib.PDFName.of('BaseFont'));
      if(bf){
        const raw = bf.encodedName || String(bf);
        return raw.replace(/^[A-Z]{6}\+/,'').replace(/[,\-].*/,'').trim()||'Helvetica';
      }
    }
  } catch(e){}
  return 'Helvetica';
}

function mapStandardFont(name){
  const n=(name||'').toLowerCase();
  if(n.includes('times')||n.includes('palatino')) return PDFLib.StandardFonts.TimesRoman;
  if(n.includes('courier')||n.includes('mono'))   return PDFLib.StandardFonts.Courier;
  return PDFLib.StandardFonts.Helvetica;
}

// ── Download ───────────────────────────────────────────────────────────────
async function downloadPDF(){
  const validBoxes = boxes.filter(b => b.textEl.textContent.trim());
  if(!validBoxes.length){ toast('No text added yet','err'); return; }

  toast('Generating…');
  try{
    const doc = await PDFLib.PDFDocument.load(pdfBytes);
    const pages = doc.getPages();

    for(const box of validBoxes){
      const pg = pages[box.page - 1];
      if(!pg) continue;
      const {height: pgH, width: pgW} = pg.getSize();

      const fontKey = mapStandardFont(box.font==='auto'?detectedFontName:box.font);
      const font = await doc.embedFont(fontKey);
      const rgb = hexToRgb(box.color);
      const color = PDFLib.rgb(rgb.r/255, rgb.g/255, rgb.b/255);

      const text = box.textEl.textContent || '';
      const lines = text.split('\n');

      // Convert screen coords → PDF coords
      // Screen: y from top. PDF: y from bottom.
      // box.y is top of textbox in scaled pixels
      const pdfX = box.x / scale;
      // For PDF bottom-left origin, y=0 is bottom.
      // We want the TOP of the text at box.y from top
      // So PDF y = pgH - (box.y/scale) - box.size
      let pdfY = pgH - (box.y / scale) - box.size;

      lines.forEach((line, i) => {
        pg.drawText(line, {
          x: Math.max(0, pdfX),
          y: Math.max(0, pdfY - i * box.size * 1.25),
          size: box.size,
          font,
          color,
          maxWidth: pgW - pdfX,
        });
      });
    }

    const out = await doc.save();
    const blob = new Blob([out], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'),{href:url,download:'edited.pdf'});
    a.click();
    URL.revokeObjectURL(url);
    toast('Downloaded ✓','ok');
  } catch(err){
    console.error(err);
    toast('Error: '+err.message,'err');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function hexToRgb(hex){
  hex=hex.replace(/^#/,'');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

let _toastTimer;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show '+(type||'');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.className='',3000);
}

// Click outside any box → deselect
document.addEventListener('mousedown', e=>{
  if(activeBox && !activeBox.wrapEl.contains(e.target) &&
     e.target!==document.getElementById('pdfStage') &&
     e.target!==document.getElementById('pdfCanvas') &&
     e.target!==document.getElementById('overlayEl')){
    // let the click on stage create a new box via onStageClick
  }
});
</script>
